name: maplepath-server

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: maplepath
      POSTGRES_USER: maplepath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the server database password}
    volumes:
      - server_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'maplepath', '-d', 'maplepath']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    image: ${APP_IMAGE:-maplepath-preview:preview-1}
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: '3000'
      UPLOAD_DIR: /app/media
    ports:
      - '127.0.0.1:${WEB_BIND_PORT:-3100}:3000'
    volumes:
      - server_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    profiles: ['https']
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set the preview domain}
      PREVIEW_USER: ${PREVIEW_USER:?Set the preview username}
      PREVIEW_PASSWORD_HASH: ${PREVIEW_PASSWORD_HASH:?Set the preview password hash}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  server_pgdata:
  server_media:
  caddy_data:
  caddy_config:
